name: Solicitar nuevas funciones

on:
  workflow_dispatch

jobs:
  solicitar-funcion:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar correo con Resend
        run: |
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "notificaciones@tudominio.com",
              "to": "arge.d.17@gmail.com",
              "subject": "🚀 Solicitud de nueva función",
              "html": "<p>Se ha solicitado una nueva función para la aplicación.</p><p>Documenta y planifica su desarrollo.</p>"
            }'
