name: Notificar cliente modificado

on:
  push:
    paths:
      - 'Directorio/**/archivo_cliente.txt'

jobs:
  notify-modificado:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Detectar cambios en cliente
        run: |
          CAMBIOS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'archivo_cliente.txt')
          if [ -n "$CAMBIOS" ]; then
            echo "Cliente modificado: $CAMBIOS"
            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
{
  "from": "notificaciones@tudominio.com",
  "to": "arge.d.17@gmail.com",
  "subject": "✏️ Cliente modificado en Axanet",
  "html": "<p>Se ha modificado un cliente en el sistema.</p><p>Archivo actualizado: $CAMBIOS</p>"
}
EOF
          else
            echo "No se detectaron modificaciones en clientes."
          fi
