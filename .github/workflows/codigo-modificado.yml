name: Notificar modificación de código

on:
  push:
    paths:
      - 'script/**/*.py'

jobs:
  notify-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Detectar cambios en código
        run: |
          CAMBIOS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.py$')
          if [ -n "$CAMBIOS" ]; then
            echo "Archivos modificados: $CAMBIOS"
            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "from": "notificaciones@resend.dev",
                "to": "arge.d.17@gmail.com",
                "subject": "💻 Código modificado en Axanet",
                "html": "<p>Se han modificado los siguientes archivos:</p><pre>'"$CAMBIOS"'</pre>"
              }'
          else
            echo "No se detectaron cambios en archivos .py."
          fi
