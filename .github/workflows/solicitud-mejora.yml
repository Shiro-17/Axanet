name: Solicitar mejoras de la app

on:
  workflow_dispatch

jobs:
  solicitar-mejora:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar correo con Resend
        run: |
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "notificaciones@tudominio.com",
              "to": "arge.d.17@gmail.com",
              "subject": "✨ Solicitud de mejora en la app",
              "html": "<p>Se ha solicitado una mejora en la aplicación.</p><p>Revisa el repositorio para planificar la implementación.</p>"
            }'
